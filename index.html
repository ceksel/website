<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ece Yüksel — Research · Design · Navigation</title>
  <meta name="description" content="Ece Yüksel — Ph.D. candidate researching spatial navigation, aging, and human-centered design. Academic black-and-white site with dark mode." />
  <meta property="og:title" content="Ece Yüksel" />
  <meta property="og:description" content="Spatial navigation · Aging · VR · Cognitive Psychology" />
  <meta name="theme-color" content="#000000" />
  <style>
    :root{--bg:#ffffff;--fg:#000000;--muted:#222222;--line:rgba(0,0,0,.12);--maxw:860px;--accent:#000000;}
    [data-theme="dark"]{--bg:#000000;--fg:#ffffff;--muted:#d0d0d0;--line:rgba(255,255,255,.18);--accent:#ffffff;}

    *, *::before, *::after{box-sizing:border-box;}
    html,body{height:100%;}
    body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 ui-sans-serif,-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
    a{color:inherit;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.18em;}

    .banner{width:100%;height:300px;background:url('22.jpg') center/cover no-repeat;filter:grayscale(100%);border-bottom:1px solid var(--line);}

    .wrap{max-width:var(--maxw);margin:0 auto;padding:28px 20px 100px;}
    header{display:grid;grid-template-columns:1fr auto;gap:18px;padding:24px 0;border-bottom:1px solid var(--line);align-items:end;}
    h1{margin:0;font-size:clamp(40px,6vw,64px);line-height:1.05;letter-spacing:-0.015em;}
    header p{margin:2px 0 0;color:var(--muted);font-size:16px;}
    .controls{display:flex;gap:10px;align-items:center;}
    .btn{border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 12px;border-radius:999px;font-size:16px;cursor:pointer;transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease;}
    .btn:hover{transform:translateY(-1px);border-color:var(--fg);}
    nav{display:flex;gap:18px;padding:10px 0 0;flex-wrap:wrap;}
    nav a{text-decoration:none;padding:6px 0;border-bottom:1px solid transparent;transition:border-color .2s ease;}
    nav a[aria-current="page"],nav a:hover{border-bottom-color:var(--fg);}

    main{display:grid;gap:44px;padding-top:28px;}
    section h2{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;}
    section .card{border-top:1px solid var(--line);padding-top:18px;}

    .grid-2{display:grid;gap:14px 24px;grid-template-columns:1fr;}
    @media(min-width:780px){.grid-2{grid-template-columns:1fr 1fr;}}
    .list{display:grid;gap:12px;margin:0;padding:0;list-style:none;}
    .item-title{font-weight:600;}
    .meta{color:var(--muted);font-size:14.5px;}

    footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;}
    .pill{display:inline-block;border:1px solid var(--fg);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--fg);margin-right:6px;}

    @keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .reveal{opacity:0;transform:translateY(8px);}
    .reveal.revealed{opacity:1;transform:none;animation:fadeSlide .6s ease both;}
    @media(prefers-reduced-motion:reduce){.btn{transition:none;}nav a{transition:none;}.reveal,.reveal.revealed{opacity:1;transform:none;animation:none;}html{scroll-behavior:auto;}}
    html{scroll-behavior:smooth;}
  </style>
</head>
<body>
  <div class="banner"></div>
  <div class="wrap">
    <header>
      <div>
        <h1>Ece Yüksel</h1>
        <p>Architect × Cognitive Psychologist · Ph.D. candidate · Spatial navigation, aging & VR</p>
        <nav aria-label="Primary">
          <a href="#about">About</a>
          <a href="#research">Research</a>
          <a href="#education">Education</a>
          <a href="#experience">Appointments</a>
          <a href="#publications">Publications</a>
          <a href="#talks">Talks</a>
          <a href="#skills">Skills</a>
          <a href="#contact">Contact</a>
        </nav>
      </div>
      <div class="controls">
        <button id="themeBtn" class="btn" aria-pressed="false" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <main>
      <!-- existing sections remain unchanged -->
    </main>

    <footer>
      <div>&copy; <span id="y"></span> Ece Yüksel · <a href="#about">Back to top</a></div>
    </footer>
  </div>

  <script>
    document.getElementById('y').textContent=new Date().getFullYear();
    const root=document.documentElement;const btn=document.getElementById('themeBtn');const PREF_KEY='theme';
    function applyTheme(t){root.setAttribute('data-theme',t);btn.textContent=(t==='dark'?'🌟':'🌙');btn.setAttribute('aria-pressed',t==='dark');}
    const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    let current=localStorage.getItem(PREF_KEY)||(prefersDark?'dark':'light');applyTheme(current);
    btn.addEventListener('click',()=>{current=(current==='dark'?'light':'dark');localStorage.setItem(PREF_KEY,current);applyTheme(current);});
    const navLinks=Array.from(document.querySelectorAll('nav a'));
    function mark(){const h=location.hash||'#about';navLinks.forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')===h?'page':'false'));}
    window.addEventListener('hashchange',mark);mark();
    const els=Array.from(document.querySelectorAll('.reveal'));
    const io=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');io.unobserve(e.target);}})},{threshold:.08});
    els.forEach(el=>io.observe(el));
  </script>
</body>
</html>
